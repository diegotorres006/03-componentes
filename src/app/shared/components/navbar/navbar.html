<div class="navbar bg-base-100 shadow-md px-4">
    <div class="navbar-start">
        <div class="dropdown">
            <label tabindex="0" class="btn btn-ghost lg:hidden">
                <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
                </svg>
            </label>
            <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-1 p-2 shadow bg-base-100 rounded-box w-52">
                <li><a routerLink="/home">Inicio</a></li>
                <li><a routerLink="/simpsons">Simpsons</a></li>
                <li><a routerLink="/estilos">Estilos</a></li>
            </ul>
        </div>
        <a class="btn btn-ghost normal-case text-xl text-primary font-bold">App Simpsons</a>
    </div>

    <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1 font-medium">
            <li><a routerLink="/home" routerLinkActive="active">Inicio</a></li>
            <li><a routerLink="/simpsons" routerLinkActive="active">Simpsons</a></li>
            <li><a routerLink="/estilos" routerLinkActive="active">Estilos</a></li>
        </ul>
    </div>

    <div class="navbar-end gap-2">
        <app-theme-switcher></app-theme-switcher>

        <!-- SECCIÓN DE USUARIO -->
        @if (currentUser()) {
        <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost btn-circle avatar placeholder">
                <div class="bg-neutral text-neutral-content rounded-full w-10">
                    <span class="text-xl">{{ currentUser()?.email?.charAt(0)?.toUpperCase() }}</span>
                </div>
            </label>
            <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-1 p-2 shadow bg-base-100 rounded-box w-52">
                <li class="menu-title px-4 py-2 text-xs opacity-50">
                    {{ currentUser()?.email }}
                </li>
                <li><a (click)="logout()" class="text-error">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
        } @else {
        <a routerLink="/login" class="btn btn-primary btn-sm">Iniciar Sesión</a>
        }
    </div>
</div>
